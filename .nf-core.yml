repository_type: pipeline

nf_core_version: 3.3.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-sudohapgen_logo_light.png
    - docs/images/nf-core-sudohapgen_logo_light.png
    - docs/images/nf-core-sudohapgen_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-sudohapgen_logo_light.png
    - docs/images/nf-core-sudohapgen_logo_light.png
    - docs/images/nf-core-sudohapgen_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: popgen48
  name: sudohapgen
  description: generate a pseudohaploid genotype calling
  author: BioInf2305
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - fastqc
    - gpu
  is_nfcore: false
